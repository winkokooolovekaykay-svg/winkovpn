name: Build WinKoKo Tunnel Release APK



on:

  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    


permissions:

  contents: read
  


jobs:

  build-release:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
          cache: gradle
          
      - name: Set up Android SDK
      
        uses: android-actions/setup-android@v3
        
      - name: Verify signing secrets
      
        env:
        
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          
        run: |
        
          for value in KEYSTORE_BASE64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
          
            if [ -z "${!value}" ]; then echo "Missing required GitHub Secret: $value"; exit 1; fi
            
          done
          
      - name: Extract structured Android project
      
        run: |
        
          rm -rf android-project
          
          mkdir android-project
          
          unzip -q WinKoKo_Tunnel_Android_Source_release.zip -d android-project
          
          chmod +x android-project/gradlew
          
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-project/release.keystore
          
      - name: Build signed release APK
      
        working-directory: android-project
        
        env:
        
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-project/release.keystore
          
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        
      - name: Upload signed release APK
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: WinKoKo-Tunnel-release-apk
          
          path: android-project/app/build/outputs/apk/release/*.apk
          
          if-no-files-found: error
          
          retention-days: 30
          

















































