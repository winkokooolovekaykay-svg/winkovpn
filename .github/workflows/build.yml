name: Build WinKoKo Tunnel APK



on:

  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    


jobs:

  build:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        


      - name: Set up JDK 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
          cache: gradle
          


      - name: Set up Android SDK
      
        uses: android-actions/setup-android@v3
        


      - name: Extract structured Android project
      
        run: |
        
          rm -rf android-project
          
          mkdir android-project
          
          unzip -q WinKoKo_Tunnel_Android_Source_fixed.zip -d android-project
          
          chmod +x android-project/gradlew
          


      - name: Build debug APK
      
        working-directory: android-project
        
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        


      - name: Upload APK artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: WinKoKo-Tunnel-debug-apk
          
          path: android-project/app/build/outputs/apk/debug/*.apk
          
          if-no-files-found: error
          
          retention-days: 30
          
































